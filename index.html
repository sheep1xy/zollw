<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Keeper</title>
<style>
  :root { --bg:#04070c; --fg:#c9d3e3; --dim:#5b6a82; --line:#1a2538; --ok:#7be0a5; --bad:#e08a7b; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); }
  body { min-height:100vh; display:flex; flex-direction:column; align-items:center;
         font:15px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding:32px 16px 48px; }
  main { width:100%; max-width:1100px; }
  .frame { border:1px solid var(--line); line-height:0; }
  .frame img { width:100%; height:auto; display:block; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-top:14px; flex-wrap:wrap; }
  a { color:var(--dim); text-decoration:none; border-bottom:1px dotted var(--dim); }
  a:hover { color:var(--fg); }
  form { display:flex; gap:8px; flex:1 1 420px; justify-content:flex-end; }
  input { flex:1; max-width:520px; background:transparent; color:var(--fg); border:1px solid var(--line);
          padding:9px 12px; font:inherit; border-radius:2px; }
  input:focus { outline:none; border-color:var(--dim); }
  input::placeholder { color:#3a465c; }
  button { background:transparent; color:var(--dim); border:1px solid var(--line); padding:9px 14px; font:inherit; cursor:pointer; border-radius:2px; }
  button:hover { color:var(--fg); border-color:var(--dim); }
  #msg { min-height:1.5em; margin-top:14px; text-align:right; color:var(--dim); }
  #msg.ok { color:var(--ok); } #msg.bad { color:var(--bad); }
  @media (max-width:600px){ form{justify-content:stretch} #msg{text-align:left} }
</style>
</head>
<body>
<main>
  <div class="frame"><img src="poster.png" alt="" width="1200" height="800"></div>
  <div class="row">
    <span><a href="poster.png" download="poster.png">original file</a> &middot; <a href="readme.txt">readme</a></span>
    <form id="f" autocomplete="off">
      <input id="a" type="text" placeholder="X: ?, Y: ?, Z: ?" spellcheck="false" aria-label="answer">
      <button type="submit">submit</button>
    </form>
  </div>
  <div id="msg" role="status"></div>
</main>
<script src="check.js"></script>
<script>
  const f = document.getElementById("f"), a = document.getElementById("a"), m = document.getElementById("msg");
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!a.value.trim()) return;
    const ok = await KeeperCheck.check(a.value);
    m.className = ok ? "ok" : "bad";
    m.textContent = ok ? "Confirmed. The keeper is waiting at those coordinates." : "Not the right light.";
  });
</script>
</body>
</html>
